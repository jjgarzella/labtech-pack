# labtech-tick — the trigger that fires one Lab Tech cycle.
#
# An order pairs a TRIGGER with an ACTION. The action is the `labtech-tick`
# formula (formulas/labtech-tick.toml); each fire pours an ephemeral wisp that
# does exactly ONE tick and exits. All durable state lives in beads + harvest
# files, so a dropped tick is safe — the next fire starts a clean cycle.
#
# TRIGGER = cooldown, 8h. A cooldown measures from the END of the last run, so a
# long experiment never stacks ticks on top of itself. `trigger = "cron"` with a
# `schedule` is the alternative when you want wall-clock ticks instead.
#
# CADENCE is the main thing an importing rig will want to change, and it is a
# judgment call about that rig's box and experiment length: fast cycles keep the
# frontier moving but cost tokens and can outrun a slow experiment. 8h is a
# deliberately conservative default. NO RAM GUARD: the tick does not watch free
# memory or skip ticks under pressure — bounding concurrency is the agent's job
# (agents/tick/agent.toml `max_active_sessions = 1`), and watching the box is the
# operator's. Do not add a memory guard here.
#
# ROUTING — `pool` is deliberately UNQUALIFIED (no "/"). gc qualifies a bare pool
# name against the order's own rig at dispatch, so `labtech.tick` resolves to
# `<importing-rig>/labtech.tick` — this pack's own dedicated single-instance tick
# agent (agents/tick/), namespaced by the `labtech` import alias. That keeps the
# pack portable: no rig name is baked in, and every importing rig gets its own
# worker. A dedicated max=1 agent — not a shared polecat POOL — is the right shape
# for a concurrency=1 sequential tick; a pool over-pours, and surplus wisps race
# each other for the same tick bead.
#
# TO OVERRIDE per rig: ship a rig-local order of the same name with your own
# `interval`/`schedule` (and `pool`, if you route ticks somewhere other than this
# pack's agent). Rig-local orders take precedence over the pack's.

[order]
description = "Lab Tech tick — one autonomous experiment-runner cycle (8-hour cooldown)"
formula = "labtech-tick"
trigger = "cooldown"
interval = "8h"
pool = "labtech.tick"
