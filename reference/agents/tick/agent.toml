# labtech.tick — the dedicated single-instance worker that runs one Lab Tech tick.
#
# WHY THIS AGENT EXISTS: a POOL is the wrong shape for a concurrency=1 sequential
# tick. Routing ticks at a shared generic polecat pool over-pours — several wisps
# race each other for the same tick bead, and surplus instances boot without a
# work bead and abort. This pack therefore ships its OWN agent, capped at a single
# instance, and orders/labtech-tick.toml routes to it. The `labtech` import alias
# namespaces this dir's name (`tick`) → addressable as <rig>/labtech.tick, which
# is what the order's unqualified `pool = "labtech.tick"` resolves to.
# (See HISTORY.md for the incident that produced this shape.)
#
# WORK_DIR — simple dir, NOT a worktree (diverges from the polecat, on purpose):
# every formula step reaches its tools by ABSOLUTE path — the rig-local runner
# scripts via {{labtech_home}} and the helper scripts via {{labtech_pack}} — and
# all bead/mail work goes through `gc` (the controller/dolt, location-independent).
# No step does cwd-relative or git work in the work_dir, so a rig checkout buys
# nothing here. A worktree would also need a worktree-setup.sh from the polecat's
# pack, which is NOT in this pack ({{.ConfigDir}} resolves to this pack's root) —
# keeping a plain dir keeps the pack self-contained. A city-scoped mayor uses the
# same simple-dir pattern.

scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/{{.AgentBase}}"
nudge = "Run gc hook to claim your routed tick step; the labtech-tick formula steps drive you orient->finish."
idle_timeout = "1h"
min_active_sessions = 0      # ephemeral: spawns on demand when the order routes a tick, exits after
max_active_sessions = 1      # THE fix: hard-caps concurrency => one instance, no surplus, no race
