# George is one persistent named session per importing rig. The named-session
# declaration in pack.toml supplies always-on lifecycle; do not also warm a pool.
scope = "rig"
provider = "codex"
wake_mode = "resume"
work_dir = ".gc/agents/{{.Rig}}/{{.AgentBase}}"
max_active_sessions = 1
nudge = "Check hook/mail and current duties; reconcile the durable serial queue, review authorized requests through labtech-queue, preserve holds and remain available."

[option_defaults]
model = "gpt-6.1-sol"
effort = "high"
