# labtech-tick — the trigger that fires one Lab Tech cycle (Lab Tech v1, mx-7co.5).
#
# An order pairs a TRIGGER with an ACTION. The action is the `labtech-tick`
# formula (formulas/labtech-tick.toml); each fire pours an ephemeral wisp that
# does exactly ONE tick and exits. All durable state lives in beads + harvest
# files, so a dropped tick is safe — the next fire starts a clean cycle.
#
# TRIGGER = manual (REVERTED from cron 2026-06-07, RAM EMERGENCY mc-wisp-nebkrm): swap
# hit 100% and the ~2.6G julia spike risked OOM-killing dolt, so the */30 cron go-live
# (mx-7co.13) was rolled back to manual to stop autonomous fires. `gc order run
# labtech-tick` still runs one cycle on demand. RE-ENABLE the cron (trigger="cron",
# schedule="*/30 * * * *") only after RAM/swap headroom is sorted. (v1 step 8 originally
# shipped manual — the mx-7co.5 acceptance gate; mx-7co.6 defined the cron wiring.)
#
# CADENCE = 30 min by overseer decision (mc-wisp-y8tzl3), overriding the epic's
# original 8-hourly default (Q10) — the box sustains fast N=1 cycles (mx-7co.10).
# CONCURRENCY = 1, hard-capped by the routed worker agent itself
# (agents/tick/agent.toml max_active_sessions=1), NOT by anything in this order.
# NO RAM GUARD: per the overseer the tick must NOT watch free RAM or skip ticks on
# memory pressure (the mayor watches RAM EXTERNALLY and pulls the cord if needed); the
# tick stays guard-free. Routing: the rig's dedicated single-instance tick worker
# math-experiments/labtech.tick (mx-7co.17 — see the pool line below), so the fired
# wisp boots with GC_AGENT (GC_BEAD_ID is claimed by the formula itself, mx-7co.18).
# The formula carries its own knobs (concurrency cap N, seed_N, lab_book id,
# paths) in [vars]; this file owns only WHEN the tick fires and WHERE it routes.

[order]
description = "Lab Tech tick — one autonomous experiment-runner cycle (REVERTED to manual, RAM emergency mc-wisp-nebkrm)"
formula = "labtech-tick"
trigger = "manual"
# WHERE a fired tick routes (mx-7co.17): the pack's OWN dedicated single-instance
# tick agent (agents/tick/, max_active_sessions=1), namespaced by the import alias
# `labtech`. This was the gasvillage.polecat POOL (mx-7co.11), but a pool is the
# wrong shape for a concurrency=1 sequential tick — it over-spawned, surplus
# polecats raced the graph.v2 steps and booted with an empty GC_BEAD_ID
# (mx-7co.14/.15). A single dedicated agent hard-caps that. Still rig-qualified
# (contains "/"), so qualifyPool returns it verbatim; matches the work beads'
# gc.routed_to. Independent of the cron flip (mx-7co.13) — even under
# trigger=manual a `gc order run labtech-tick` has a worker to dispatch to.
pool = "math-experiments/labtech.tick"
