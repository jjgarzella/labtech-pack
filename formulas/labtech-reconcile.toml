formula = "labtech-reconcile"
version = 2
description = """
George's eight-hour observation/checkpoint only; never launch, approve, or retry experiments.

Claim this routed formula bead as persistent George without disturbing other work.
Run `python3 {{labtech_pack}}/bin/serial_queue.py --home {{labtech_home}} reconcile`.
Read `{{labtech_pack}}/docs/serial-queue.md`. Inspect the active identity/receipt and
measurement/artifact evidence; retain raw evidence and all attempts. Recover a
missed completion nudge from the receipt and update the request bead/lab book
`{{lab_book}}` with request/run/attempt IDs, exit status, measured outcome or missing
measurement, paths, holds and next action. Active quiet logs are not a failure.
If unchanged and idle, retain the checkpoint without adding an empty lab-book entry.

This reconciliation step NEVER launches, approves, selects goals, retries, changes
parameters, kills processes, resumes historical work or invokes `labtech-tick`.
If approved queue work needs service, use a separately authorized labtech-queue
cycle. Missing exit receipts or identity mismatch require coordinator review and
retain the active slot. Close only this formula work bead; remain available and
never drain/reset the persistent session.
"""

[vars.labtech_home]
default = ""
[vars.labtech_pack]
default = ""
[vars.lab_book]
default = ""

