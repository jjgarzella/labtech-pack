description = """
Lab Tech tick — one autonomous experiment-runner cycle.

Lab Tech is NOT an always-on session. It is a formula `order`
(`orders/labtech-tick.toml`, like `mol-dog-stale-db`). Each fire pours an ephemeral
wisp that does exactly ONE tick and exits. All durable state lives in beads (the
lab-book + experiment beads) and on disk (harvest snapshots) — never in the wisp's
head, never in agent context.

## What one tick does

    orient -> reap (ping in-flight, pin exited) -> harvest -> diff vs last cycle
           -> lab-book digest -> dispatch under the N cap -> exit

Lab Tech is *never told "done"*. It infers progress by diffing harvests across
cycles and watching the goal's progress metric climb, then plateau (Q1).

## The data model it operates (read the brains prompt too: {{labtech_pack}}/agents/tick/prompt.template.md)

- **lab-book** (`{{lab_book}}`): Lab-Tech-owned root, ONE per rig, outlives every
  goal-group. Experiment beads attach as its children. It holds the per-cycle
  harvest digests + cross-cycle synthesis.
- **experiment** bead: one per dispatched run. `run_id == the bead id`. Parent =
  the lab-book. Links to the goal it served via `goal_id`/`goal_group_id` metadata.
  Lifecycle = **PINNED, not closed**: running = status open; exited = `pinned=1`
  (permanent, auditable, auto-hidden from work views and from the in-flight count).
- **goal-group / goal**: crew-authored, **READ-ONLY to Lab Tech**. The goal body +
  metadata name the results `table`, the `filter`, and the `uniqueness_key` that
  define progress. Lab Tech serves goals; it never edits them.

## Three contracts it shells out to (rig-local; networking lives in them)

    {{labtech_home}}/dispatch.sh <run_id> <resolved-command>   # nohup detach, pidfile
    {{labtech_home}}/ping.sh     <run_id>                      # exit 0 alive / 1 exited
    {{labtech_home}}/harvest.sh  <cycle> <table>               # dump table -> harvest/<cycle>.json

and the catalog (`{{labtech_home}}/experiments.toml`) is the menu of runnable
experiments. Two pack-owned helpers turn catalog + goal into concrete actions:

    {{labtech_pack}}/bin/resolve_command.py   # render the catalog `command` template
    {{labtech_pack}}/bin/progress_metric.py   # count distinct result-keys in a harvest

## Concurrency (Q8)

Single rig-global cap, `concurrency = {{concurrency}}` (default 1). In-flight = count of
OPEN, non-pinned experiment children of the lab-book. At the cap, this tick skips
dispatch — there is no queue; the next tick is the retry.

## Baseline caveat

The results table is usually already NON-EMPTY when a rig adopts Lab Tech. The first
tick's harvest is the BASELINE; only distinct keys that appear AFTER it count as Lab
Tech's progress. The diff step subtracts the baseline so pre-existing rows are never
mistaken for new results.

## Single-session, NOT graph.v2

This formula is ONE step (the default contract, like `mol-dog-stale-db`): the whole
cycle runs in ONE shell execution, so every per-tick value lives in shell variables
— there are NO cross-step `state/<root>.env` hops and NO control-dispatcher handoff.
That is the point: a tick has no cross-step dependency to lose, so there is nothing
for a handoff to drop. Durable state lives only in beads and on disk, never in the
wisp's head — so a crashed tick is safe to drop; the next fire starts a clean tick
and re-derives everything from that durable state. Read the step description
top-to-bottom before acting; config vars override the defaults shown."""
formula = "labtech-tick"
version = 1

[vars]
# The three vars below are REQUIRED and deliberately have no default: they name one
# rig's filesystem and one rig's lab-book bead, so a baked-in value would be another
# rig's wrong answer. The importing rig supplies them, e.g. in city.toml:
#
#   [[rigs]]
#   name = "<rig>"
#   [rigs.formula_vars]
#   labtech_home = "/abs/path/to/<rig>/labtech"
#   labtech_pack = "/abs/path/to/<city>/packs/labtech"
#   lab_book     = "<lab-book-bead-id>"
#
# The tick step guards each one with `${VAR:?}` and aborts with an actionable message
# rather than running against an empty path.
[vars.labtech_home]
description = "REQUIRED. Abs path to the rig-local Lab Tech dir (runner scripts + experiments.toml + runtime runs/ & harvest/). Rig-owned; set it per rig — there is no portable default."
default = ""

[vars.labtech_pack]
description = "REQUIRED. Abs path to this pack's composed root (for bin/ helper scripts). Set it per rig/city — where the pack lands depends on the importing city's layout."
default = ""

[vars.lab_book]
description = "REQUIRED. Bead id of the Lab-Tech-owned lab-book root for this rig. Experiment beads attach as its children. One lab-book per rig; create it before the first tick."
default = ""

[vars.concurrency]
description = "Rig-global in-flight cap N (Q8). In-flight = open non-pinned experiment children of the lab-book. At cap, skip dispatch this tick."
default = "1"

[vars.experiment_bead_type]
description = "Bead type for experiment beads. Most bd builds register no custom 'experiment' type, so the default is a task tagged with the 'experiment' label; swap to 'experiment' here if your build registers that type."
default = "task"

[vars.seed_N]
description = "Fallback N (deformations to sample) used ONLY if the catalog gives no N default. 1 = one deformation per tick => fast cycles; the catalog's own N default normally wins. Raise on a documented plateau, never p."
default = "1"

[[steps]]
id = "tick"
title = "Run one full Lab Tech cycle in one shell execution (orient -> reap -> harvest/diff -> digest -> dispatch -> exit)"
description = """
This is a SINGLE-SESSION step: run the whole cycle as ONE shell script so every
derived value stays in the same process (no cross-step state files). Your standing
brains prompt frames the data model, the read-only-goal rule, the baseline caveat,
the box caveat, and the N-ramp judgment — skim it if anything below is unclear; it
is also wired as your agent prompt: `{{labtech_pack}}/agents/tick/prompt.template.md`.

```bash
set -uo pipefail

# ── Drain the runtime on ANY exit. Defined FIRST so that even the identity/config
#    guards below — which abort the shell outright — still release the runtime. ──
DRAIN_ACKED=0
drain_once() { [ "$DRAIN_ACKED" = 1 ] || { gc runtime drain-ack || true; DRAIN_ACKED=1; }; }
trap drain_once EXIT

# ── Identity. GC_AGENT is injected. GC_BEAD_ID is NOT guaranteed to be — some
#    runtimes boot a wisp bare — so rather than depend on it we CLAIM the routed
#    work bead ourselves below via the ordinary routed/claim path (and still honor
#    GC_BEAD_ID if it IS set); never a manual GC_BEAD_ID export. ──
: "${GC_AGENT:?GC_AGENT empty — session harness did not inject identity; refuse to self-poll}"

# ── Config from the formula [vars]; ALL tick state lives in these shell vars. The
#    three rig-specific ones are REQUIRED — abort loudly rather than run against an
#    empty path or bead id (see the [vars] block for how a rig supplies them). ──
LABTECH_HOME="{{labtech_home}}"
LABTECH_PACK="{{labtech_pack}}"
LAB_BOOK="{{lab_book}}"
: "${LABTECH_HOME:?labtech_home is unset — set it in the importing rig [rigs.formula_vars]}"
: "${LABTECH_PACK:?labtech_pack is unset — set it in the importing rig [rigs.formula_vars]}"
: "${LAB_BOOK:?lab_book is unset — set the lab-book bead id in [rigs.formula_vars]}"
CAP="{{concurrency}}"
CAT="$LABTECH_HOME/experiments.toml"
export LABTECH_HOME            # dispatch/ping/harvest honor this for runs/ & harvest/

# ── Pin gc to the SERVED RIG's bead store. The tick agent's work_dir is a plain dir
#    under the city root, where `gc bd list` resolves to the city scope and silently
#    returns no goals / no lab-book children; $LABTECH_HOME lives inside the rig
#    checkout, so cd-ing there makes every `gc bd` query hit the rig's store. ──
cd "$LABTECH_HOME" 2>/dev/null || cd "$(dirname "$LABTECH_HOME")" 2>/dev/null || true

# ── Acquire the tick work bead = the formula's single STEP bead routed to me. With
#    no GC_BEAD_ID injection, claim it via the routed/unassigned path (resume-safe:
#    reuse an already in-progress claim first). The dedicated agent is max=1, but a
#    routed claim is not exclusive, so VERIFY ownership after claiming. ──
WORK_BEAD="${GC_BEAD_ID:-}"
[ -n "$WORK_BEAD" ] || WORK_BEAD=$(gc bd list --assignee="$GC_SESSION_NAME" --status=in_progress --include-ephemeral --json 2>/dev/null | jq -r '.[0].id // empty')
if [ -z "$WORK_BEAD" ]; then
  CAND=$(gc bd ready --include-ephemeral --metadata-field "gc.routed_to=$GC_AGENT" --unassigned --exclude-type=epic --json --sort oldest --limit=1 2>/dev/null | jq -r '.[0].id // empty')
  if [ -n "$CAND" ]; then
    gc bd update "$CAND" --claim >/dev/null 2>&1 || true
    [ "$(gc bd show "$CAND" --json 2>/dev/null | jq -r '.[0].assignee // empty')" = "$GC_SESSION_NAME" ] && WORK_BEAD="$CAND"
  fi
fi
: "${WORK_BEAD:?no tick work bead routed to $GC_AGENT could be claimed; nothing to do this tick}"

# ── The ONE clean way out: close the tick step bead, drain the runtime, exit. ──
finish() { gc bd close "$WORK_BEAD" --reason "Lab Tech tick complete — ${1:-(skipped)}" || true; drain_once; exit 0; }

# ── Sanity-check the contract pieces exist (warn, don't die). ──
for f in dispatch.sh ping.sh harvest.sh experiments.toml; do
  [ -e "$LABTECH_HOME/$f" ] || echo "MISSING $LABTECH_HOME/$f"
done
[ -f "$LABTECH_PACK/bin/resolve_command.py" ] || echo "MISSING resolver $LABTECH_PACK/bin/resolve_command.py"
gc bd show "$LAB_BOOK" --json >/dev/null || echo "lab-book $LAB_BOOK not found"

# ── Mail check (escalations / param overrides from the crew); archive what you handle. ──
gc mail inbox 2>/dev/null | head -40 || true

# ════════════ ORIENT — pick the goal to serve (READ-ONLY), open a cycle ════════════
# Rule: among OPEN goals, take the one whose results table a catalog experiment
# produces (goal.table == experiment.table), preferring higher priority then older.
mapfile -t CAT_TABLES < <(
  for e in $(python3 "$LABTECH_PACK/bin/resolve_command.py" list --catalog "$CAT"); do
    python3 "$LABTECH_PACK/bin/resolve_command.py" show --catalog "$CAT" --experiment "$e" --json | jq -r '.table'
  done)
GOALS=$(gc bd list --type=goal --status=open --json)
GOAL_ID=""; GOAL_TABLE=""; GOAL_GROUP=""; GOAL_FILTER=""; GOAL_KEY=""
while read -r gid gtable; do
  for t in "${CAT_TABLES[@]}"; do
    if [ "$gtable" = "$t" ]; then GOAL_ID="$gid"; GOAL_TABLE="$gtable"; break; fi
  done
  [ -n "$GOAL_ID" ] && break
done < <(echo "$GOALS" | jq -r 'sort_by(.priority, .created_at) | .[] | "\\(.id) \\(.metadata.table // "")"')

CYCLE=$(date -u +%Y%m%dT%H%M%SZ)   # opens this tick's cycle; names the harvest file
if [ -n "$GOAL_ID" ]; then
  # Read the goal's progress definition (filter + uniqueness key + group) straight
  # from its metadata — keeps the goal authoritative; no progress rule is hard-coded.
  GMETA=$(gc bd show "$GOAL_ID" --json | jq '.[0].metadata')
  GOAL_GROUP=$(gc bd show "$GOAL_ID" --json | jq -r '.[0].parent // ""')
  GOAL_FILTER=$(echo "$GMETA" | jq -c '.filter // {}')
  # The goal OWNS the progress rule; the pack hard-codes no columns. A goal with no
  # uniqueness_key gets harvested but not scored — say so rather than invent a key.
  GOAL_KEY=$(echo "$GMETA" | jq -c '.uniqueness_key // empty')
  [ -n "$GOAL_KEY" ] || echo "goal $GOAL_ID has no metadata.uniqueness_key — harvesting, but no progress metric this cycle (the goal defines the metric, not the pack)."
  [ -n "$GOAL_TABLE" ] && [ "$GOAL_TABLE" != "null" ] || GOAL_TABLE=$(echo "$GMETA" | jq -r '.table')
  gc bd update "$WORK_BEAD" --set-metadata labtech_cycle="$CYCLE" --set-metadata labtech_goal="$GOAL_ID" || true
  echo "Serving goal $GOAL_ID (group $GOAL_GROUP) table=$GOAL_TABLE filter=$GOAL_FILTER key=$GOAL_KEY"
else
  echo "No open goal matches a catalog table; will reap in-flight, then skip harvest/dispatch this tick."
fi

# ════════════ REAP — ping in-flight experiments; PIN the ones that exited ════════════
# Freeing the slot (pin exited runs) BEFORE the cap check is what lets dispatch fire.
NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
INFLIGHT_IDS=$(gc bd list --parent "$LAB_BOOK" --status open --no-pinned --json | jq -r '.[].id')
for id in $INFLIGHT_IDS; do
  if bash "$LABTECH_HOME/ping.sh" "$id"; then
    echo "[reap] $id still running"
    gc bd update "$id" --append-notes "- $NOW ping: alive" || true
  else
    echo "[reap] $id exited -> pinning"
    # PIN. Prefer the flag; fall back to raw SQL on builds that lack `--pinned`.
    gc bd update "$id" --pinned >/dev/null 2>&1 \
      || gc bd sql "UPDATE issues SET pinned=1 WHERE id='$id'" \
      || echo "pin FAILED for $id"
    gc bd update "$id" \
      --set-metadata exited_at="$NOW" \
      --append-notes "## Ping observations
- $NOW ping: exited (pidfile reaped); pinned as a permanent record." || true
  fi
done
INFLIGHT_NOW=$(gc bd list --parent "$LAB_BOOK" --status open --no-pinned --json | jq 'length')
echo "[reap] in-flight after reap: $INFLIGHT_NOW (cap $CAP)"

# ════════════ HARVEST + DIFF — snapshot the table; diff vs previous + baseline ════════════
HARVEST_OK=0; NEW_KEYS=""; NOW_CT=""; DELTA_PREV=""; DELTA_BASE=""
HARV_DIR="$LABTECH_HOME/harvest"
if [ -n "$GOAL_ID" ]; then
  # Networking lives inside harvest.sh, including whatever credential it needs.
  if bash "$LABTECH_HOME/harvest.sh" "$CYCLE" "$GOAL_TABLE"; then
    CUR="$HARV_DIR/$CYCLE.json"; HARVEST_OK=1
  else
    echo "[harvest] FAILED for table $GOAL_TABLE — skipping diff/digest this cycle."
    gc bd update "$LAB_BOOK" --append-notes "## Cycle $CYCLE
- Harvest of table $GOAL_TABLE FAILED; no diff this cycle (will retry next tick)." || true
  fi
fi
if [ "$HARVEST_OK" = 1 ] && [ -n "$GOAL_KEY" ]; then
  # Locate previous + baseline snapshots. Baseline = first-ever harvest (its rows are
  # pre-existing); previous = newest snapshot strictly older than this one. ONLY
  # timestamp-named snapshots count (CYCLE = date -u +%Y%m%dT%H%M%SZ). A stray
  # non-conforming file (e.g. a leftover smoke-*.json) sorts AFTER digits and would
  # otherwise be mis-picked as "newest", poisoning the diff baseline. The format is
  # fixed-width & zero-padded, so lexical sort == chronological order.
  mapfile -t SNAPS < <(ls -1 "$HARV_DIR"/*.json 2>/dev/null | grep -E '/[0-9]{8}T[0-9]{6}Z\\.json$' | sort)
  BASELINE="${SNAPS[0]:-$CUR}"   # oldest snapshot ever; on the FIRST tick that IS this one
  PREV=""
  for ((i=${#SNAPS[@]}-1; i>=0; i--)); do
    if [ "${SNAPS[$i]}" != "$CUR" ]; then PREV="${SNAPS[$i]}"; break; fi
  done
  # Distinct-key counts via the goal's filter + uniqueness key. On the first tick
  # BASE_CT == NOW_CT (Δbaseline 0) and there is no PREV (Δprev 0) — pre-existing rows
  # never read as progress.
  metric() { python3 "$LABTECH_PACK/bin/progress_metric.py" --harvest "$1" --filter "$GOAL_FILTER" --key "$GOAL_KEY"; }
  NOW_CT=$(metric "$CUR")
  BASE_CT=$(metric "$BASELINE")
  if [ -n "$PREV" ]; then PREV_CT=$(metric "$PREV"); else PREV_CT="$NOW_CT"; fi
  DELTA_PREV=$(( NOW_CT - PREV_CT ))
  DELTA_BASE=$(( NOW_CT - BASE_CT ))
  # Which distinct keys are NEW since the previous cycle (the freshly-found results).
  keys() { python3 "$LABTECH_PACK/bin/progress_metric.py" --harvest "$1" --filter "$GOAL_FILTER" --key "$GOAL_KEY" --dump-keys | sort -u; }
  if [ -n "$PREV" ]; then NEW_KEYS=$(comm -23 <(keys "$CUR") <(keys "$PREV")); fi
  echo "[diff] distinct now=$NOW_CT  Δprev=$DELTA_PREV  Δbaseline=$DELTA_BASE  (prev=$PREV_CT base=$BASE_CT)"
fi

# ════════════ DIGEST — append this cycle's record to the lab-book ════════════
if [ "$HARVEST_OK" = 1 ]; then
  EXITED=$(gc bd list --parent "$LAB_BOOK" --pinned --json | jq -r '[.[] | select(.metadata.exited_at != null)] | length')
  if [ -n "$GOAL_KEY" ]; then
    NEW_N=$(printf '%s\n' "$NEW_KEYS" | sed '/^$/d' | wc -l | tr -d ' ')
    METRIC_LINE="- Progress metric (distinct $GOAL_KEY where $GOAL_FILTER): **$NOW_CT** (Δ vs last cycle: $DELTA_PREV, Δ vs baseline: $DELTA_BASE)
- New distinct keys this cycle: $NEW_N"
  else
    METRIC_LINE="- Progress metric: NOT COMPUTED — goal $GOAL_ID defines no metadata.uniqueness_key."
  fi
  gc bd update "$LAB_BOOK" --append-notes "## Cycle $CYCLE — goal $GOAL_ID ($GOAL_TABLE)
$METRIC_LINE
- In-flight after reap: ${INFLIGHT_NOW:-?} / cap $CAP; pinned (exited) experiments to date: $EXITED
- Snapshot: harvest/$CYCLE.json" || true
fi
# JUDGMENT (optional but encouraged): on a multi-cycle trend — a plateau (several
# Δprev=0 in a row), a fresh burst of results, or a barren stretch — also append a
# short `### Synthesis` / `### Recommendation` to the lab-book (e.g. "3 barren cycles
# at the current params → recommend raising N"). NEVER touch the goal / goal-group beads.

# ════════════ DISPATCH — launch <=1 experiment if under the cap (the tick = the retry) ════════════
do_dispatch() {
  [ -n "${GOAL_ID:-}" ] || { echo "[dispatch] no goal selected; nothing to dispatch."; return 0; }
  # Recompute in-flight live (don't trust an earlier count).
  INFLIGHT=$(gc bd list --parent "$LAB_BOOK" --status open --no-pinned --json | jq 'length')
  if [ "$INFLIGHT" -ge "$CAP" ]; then
    echo "[dispatch] at cap ($INFLIGHT/$CAP) — skip dispatch this tick (the next tick retries)."
    gc bd update "$LAB_BOOK" --append-notes "- Cycle $CYCLE: at cap ($INFLIGHT/$CAP), no dispatch." || true
    return 0
  fi
  # 1. Select the experiment whose table matches the goal's table.
  EXP_NAME=""
  for e in $(python3 "$LABTECH_PACK/bin/resolve_command.py" list --catalog "$CAT"); do
    t=$(python3 "$LABTECH_PACK/bin/resolve_command.py" show --catalog "$CAT" --experiment "$e" --json | jq -r '.table')
    if [ "$t" = "$GOAL_TABLE" ]; then EXP_NAME="$e"; break; fi
  done
  [ -n "$EXP_NAME" ] || { echo "No catalog experiment writes $GOAL_TABLE; escalate."; \
    gc mail send mayor/ -s "Lab Tech: no experiment for goal $GOAL_ID table $GOAL_TABLE" \
      -m "Tick $CYCLE found an open goal whose table no catalog experiment produces. Add a catalog entry."; return 0; }
  # 2. Scientific parameters (JUDGMENT): the goal fixes p; N is the tunable. Start at
  #    the catalog default, falling back to seed_N only if empty. Raise N here on a
  #    documented plateau, never p (the goal owns p). Cost grows much faster in p than
  #    in N, and a thread-greedy run can OOM the compute box outright — where that
  #    ceiling sits is a property of the rig's box, so consult the rig's own Lab Tech
  #    docs for its measured limits rather than assuming any number here.
  GP=$(gc bd show "$GOAL_ID" --json | jq -r '.[0].metadata.p // empty')
  [ -n "$GP" ] || GP=$(echo "$GOAL_FILTER" | jq -r '.p // empty')
  [ -n "$GP" ] || { echo "could not determine prime p for goal $GOAL_ID; skipping dispatch."; return 1; }
  N_DEFAULT=$(python3 "$LABTECH_PACK/bin/resolve_command.py" show --catalog "$CAT" --experiment "$EXP_NAME" --json \
    | jq -r '.parameters[] | select(.name=="N") | .default')
  NN="${N_DEFAULT:-{{seed_N}}}"      # <-- adjust here if a plateau warrants a bigger N
  echo "[dispatch] experiment=$EXP_NAME p=$GP N=$NN"
  # 3. Mint the experiment bead — its id IS the run_id (Q7). Parent = lab-book; tag it.
  TITLE="$EXP_NAME p=$GP N=$NN (cycle $CYCLE)"
  RUN_ID=$(gc bd create --silent \
    --type "{{experiment_bead_type}}" \
    --parent "$LAB_BOOK" \
    -l "experiment,experiment:$EXP_NAME,labtech" \
    --title "$TITLE")
  [ -n "$RUN_ID" ] || { echo "bd create returned no id; aborting dispatch."; return 1; }
  echo "[dispatch] run_id=$RUN_ID"
  # 4. Resolve the catalog command for this run_id + params, then DISPATCH it detached
  #    (fire-and-forget; the bead stays OPEN until a later tick pings it exited).
  RESOLVED=$(python3 "$LABTECH_PACK/bin/resolve_command.py" render \
    --catalog "$CAT" --experiment "$EXP_NAME" --run-id "$RUN_ID" -p "p=$GP" -p "N=$NN")
  echo "[dispatch] resolved: $RESOLVED"
  bash "$LABTECH_HOME/dispatch.sh" "$RUN_ID" "$RESOLVED"
  DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  # 5. Record the full dispatch context on the experiment bead (machine-truth in
  #    metadata, prose in the body). This is the audit trail.
  PARAMS_JSON=$(jq -nc --arg p "$GP" --arg N "$NN" '{p:($p|tonumber), N:($N|tonumber)}')
  gc bd update "$RUN_ID" \
    --set-metadata run_id="$RUN_ID" \
    --set-metadata experiment_name="$EXP_NAME" \
    --set-metadata params="$PARAMS_JSON" \
    --set-metadata resolved_command="$RESOLVED" \
    --set-metadata goal_id="$GOAL_ID" \
    --set-metadata goal_group_id="$GOAL_GROUP" \
    --set-metadata dispatched_at="$DISPATCHED_AT" \
    --append-notes "## Dispatch context
- Cycle: $CYCLE
- Goal: $GOAL_ID (group $GOAL_GROUP), table $GOAL_TABLE
- Resolved command: $RESOLVED
- Dispatched at: $DISPATCHED_AT (pidfile runs/$RUN_ID.pid)

## Ping observations
(running — first ping is the next tick)

## Notes
" || true
  gc bd update "$LAB_BOOK" --append-notes "- Cycle $CYCLE: dispatched $RUN_ID ($EXP_NAME p=$GP N=$NN)." || true
}
do_dispatch || true

# ════════════ FINISH — close the tick bead, drain the runtime, exit ════════════
SUMMARY="cycle ${CYCLE:-?}: metric ${NOW_CT:-?} (Δprev ${DELTA_PREV:-?}, Δbase ${DELTA_BASE:-?}), in-flight ${INFLIGHT:-${INFLIGHT_NOW:-?}}/${CAP:-?}"
finish "$SUMMARY"
```

**Exit criteria (all in ONE session):** identity validated; in-flight experiments
pinged and the exited ones pinned; when a goal is served, a harvest snapshot written
and a cycle digest appended to the lab-book; at most one experiment dispatched (or a
documented at-cap / no-goal / no-experiment skip); the work bead closed and the
runtime drained — with NO control-dispatcher and NO surplus agent."""
